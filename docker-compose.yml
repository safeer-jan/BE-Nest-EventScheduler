services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-scheduler_db}
    # 5433 on the host so it does not collide with the Auth Service's Postgres (5432)
    ports:
      - '5433:5432'
    volumes:
      - scheduler_pg_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scheduler_pg_data:
